name: papanek
description: "Papánek — offline kuchařka pro začátečníky."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  in_app_purchase: ^3.3.1
  intl: any
  ol1n_telemetry:
    git:
      url: https://github.com/lioilsources/Ol1nTelemetry.git
      ref: v0.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/content.db
    - assets/images/
    - assets/photos/hero/
    - assets/photos/step/
    - assets/photos/ing/
    - assets/photos/tool/

flutter_launcher_icons:
  ios: true
  android: true
  image_path: assets/icon/icon.png
  # Adaptive icon (API 26+): layers are on the full 108 dp canvas, the pot
  # inside the 66 dp safe zone, so no inset; background = the art's orange.
  adaptive_icon_background: "#FA8815"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
