cs:
  title: Jednoduchá miso polévka
  summary: Rychlá japonská polévka s tofu a jarní cibulkou. Hotová za 15 minut bez složitých postupů.
  steps:
    - text: Do hrnce nalij 1 litr vody a přiveď ji k varu.
    - text: Vsyp instantní dashi a míchej, dokud se nerozpustí.
    - text: Ztlum plamen tak, aby vývar jen mírně probublával, a přidej tofu. Nech ho 2 minuty prohřát.
      timer_sec: 120
    - text: Vypni plotnu. V malé misce rozmíchej miso pastu s naběračkou horkého vývaru do hladka.
    - text: Směs vlij zpět do hrnce a opatrně promíchej, aby se tofu nerozpadlo.
    - text: Rozlij polévku do misek a posyp jarní cibulkou.
  tips: Polévka s misem už se nesmí vařit, jinak ztratí vůni a chuť. Při ohřívání ji jen zahřej, nenech ji vřít.
en:
  title: Simple Miso Soup
  summary: A quick Japanese soup with tofu and spring onion. Ready in 15 minutes with no complicated steps.
  steps:
    - text: Pour 1 liter of water into a pot and bring it to a boil.
    - text: Add the instant dashi and stir until it dissolves.
    - text: Lower the heat so the broth just gently simmers and add the tofu. Let it warm through for 2 minutes.
      timer_sec: 120
    - text: Turn off the heat. In a small bowl, stir the miso paste with a ladle of hot broth until smooth.
    - text: Pour the mixture back into the pot and stir gently so the tofu does not break apart.
    - text: Ladle the soup into bowls and sprinkle with spring onion.
  tips: Once the miso is in, the soup must not boil, or it will lose its aroma and flavor. When reheating, only warm it up and do not let it boil.
