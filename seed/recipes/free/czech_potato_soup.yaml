cs:
  title: Klasická česká bramboračka
  summary: Hřejivá a sytá polévka z brambor s majoránkou a koprem. Hotová za 45 minut, ideální na studené dny.
  steps:
    - text: V hrnci rozehřej olej a osmahni na něm cibuli asi 5 minut dosklovita.
      timer_sec: 300
    - text: Přidej brambory a mrkev, zalij 1 litrem vody a přidej bujón.
    - text: Přiveď k varu, pak stáhni plamen a vař 20 minut, dokud brambory nezměknou.
      timer_sec: 1200
    - text: Přidej česnek a majoránku, kterou předtím rozemni mezi dlaněmi.
    - text: Vlij smetanu, promíchej a nech polévku 2 minuty prohřát. Už ji nevař prudce.
      timer_sec: 120
    - text: Polévku osol a opepři.
    - text: Chléb opeč v toustovači nebo na suché pánvi.
    - text: Polévku nalij do talířů, posyp koprem a podávej s opečeným chlebem.
  tips: Pro hustší polévku rozmixuj tyčovým mixérem asi třetinu polévky přímo v hrnci, ještě než přidáš smetanu. Kopr přidávej až do talíře, vařením ztrácí vůni.
en:
  title: Classic Czech Potato Soup
  summary: A warming, filling potato soup with marjoram and dill. Ready in 45 minutes and perfect for cold days.
  steps:
    - text: Heat the oil in a pot and fry the onion for about 5 minutes until translucent.
      timer_sec: 300
    - text: Add the potatoes and carrot, pour in 1 litre of water and add the stock cube.
    - text: Bring to a boil, then turn the heat down and simmer for 20 minutes until the potatoes are soft.
      timer_sec: 1200
    - text: Add the garlic and the marjoram, rubbing it between your palms first.
    - text: Pour in the cream, stir and let the soup heat through for 2 minutes. Do not let it boil hard any more.
      timer_sec: 120
    - text: Season the soup with salt and pepper.
    - text: Toast the bread in a toaster or in a dry frying pan.
    - text: Ladle the soup into bowls, sprinkle with dill and serve with the toasted bread.
  tips: For a thicker soup, blend about a third of it with an immersion blender right in the pot before adding the cream. Add the dill only in the bowl, as cooking takes away its aroma.
