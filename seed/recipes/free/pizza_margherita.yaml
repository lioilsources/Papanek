cs:
  title: Pizza Margherita
  summary: Klasická italská pizza s tenkým těstem, rajčatovou omáčkou a mozzarellou. Upečeš ji doma na obyčejném plechu.
  steps:
    - text: V míse smíchej mouku, droždí a sůl.
    - text: Přilij vlažnou vodu a olivový olej a hněť asi 5 minut, dokud není těsto hladké a pružné.
    - text: Mísu přikryj utěrkou a nech těsto na teplém místě kynout 1 hodinu, dokud nezdvojnásobí objem.
      timer_sec: 3600
    - text: Předehřej troubu na 250 °C a plech vylož pečicím papírem.
    - text: Těsto krátce prohněť a na pomoučené desce ho rozválej na tenký plát velký jako plech.
    - text: Přendej těsto na plech a rovnoměrně ho potři passatou, okraje nech volné.
    - text: Rozlož na pizzu kousky mozzarelly a podle chuti opepři.
    - text: Peč na nejnižší příčce trouby 12–15 minut, dokud okraje nezezlátnou a sýr nezačne bublat.
      timer_sec: 900
    - text: Vyndej pizzu z trouby, posyp ji lístky bazalky, nakrájej a podávej horkou.
  tips: Když se těsto při válení stahuje zpátky, nech ho 10 minut odpočinout a pak válej dál. Mozzarellu dobře sceď, jinak pustí vodu a těsto bude rozměklé.
en:
  title: Pizza Margherita
  summary: Classic Italian pizza with a thin crust, tomato sauce and mozzarella. You can bake it at home on a regular baking tray.
  steps:
    - text: In a bowl, mix the flour, yeast and salt.
    - text: Pour in the lukewarm water and olive oil and knead for about 5 minutes until the dough is smooth and elastic.
    - text: Cover the bowl with a cloth and let the dough rise in a warm place for 1 hour until doubled in size.
      timer_sec: 3600
    - text: Preheat the oven to 250 °C and line a baking tray with baking paper.
    - text: Briefly knead the dough and roll it out on a floured surface into a thin sheet the size of the tray.
    - text: Transfer the dough to the tray and spread the passata evenly over it, leaving the edges free.
    - text: Scatter the mozzarella pieces over the pizza and season with pepper to taste.
    - text: Bake on the lowest rack of the oven for 12–15 minutes until the edges are golden and the cheese is bubbling.
      timer_sec: 900
    - text: Take the pizza out of the oven, scatter the basil leaves over it, slice and serve hot.
  tips: If the dough keeps shrinking back while rolling, let it rest for 10 minutes and then continue. Drain the mozzarella well, otherwise it releases water and the crust turns soggy.
